name: Daily interview mailer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interview-mailer
  cancel-in-progress: false

jobs:
  deliver:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.MAILER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Process replies and deliver daily questions
        env:
          MAILER_GOOGLE_CREDENTIALS: ${{ secrets.MAILER_GOOGLE_CREDENTIALS }}
          MAILER_SENDER: ${{ secrets.MAILER_SENDER }}
          MAILER_SHEET_ID: ${{ secrets.MAILER_SHEET_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAILER_GEMINI_FREE_TIER_CONFIRMED: ${{ vars.MAILER_GEMINI_FREE_TIER_CONFIRMED }}
        run: python -m mailer --config mailer/config.example.json run
